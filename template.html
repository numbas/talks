<!doctype html>
<html lang="en">
    <head>
        <title>{{title}}</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet"> 
		<link rel="stylesheet" href="style.css" id="theme">
        <script src="presentation.js" type="module"></script>
    </head>
    <body>
        <header>
            <a id="uni" target="_blank" href="https://ncl.ac.uk">
                <svg title="Newcastle University" viewBox="0 0 793.45331 225.10667" xmlns="http://www.w3.org/2000/svg">
                    <use href="images/ncl-logo.svg#logo" width="793" height="225"></use>
                </svg>
            </a>
            <div id="qrcode"></div>
        </header>
        <main>
            <section id="start">
                <img id="logo" alt="Numbas" src="images/numbas-logo.svg">
                <h1>{{title}}</h1>
                <p>
                    {{presenter}}
                    <br>
                    {{affiliation}}
                </p>
                <p>{{event}}</p>
            </section>
{{markdown content}}
        </main>
        <footer><a id="url"></a></footer>
    </body>
</html>
